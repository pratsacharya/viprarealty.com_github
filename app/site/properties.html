<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Properties — Vipra Realty</title>
<meta name="description" content="Browse residential and commercial properties for rent and sale in Bangalore, Mumbai, Navi Mumbai and Thane with Vipra Realty.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/site.css">
</head>
<body>
<div class="page">

  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="index.html" aria-label="Vipra Realty home"><img src="assets/logo.png" alt="Vipra Realty"></a>
      <nav class="nav" aria-label="Primary">
        <a href="index.html">Home</a>
        <a href="properties.html" aria-current="page">Properties</a>
        <a href="contact.html">Contact</a>
      </nav>
      <div class="header-actions">
        <a href="tel:+919108598918" class="btn btn-line btn-sm hide-m">+91 91085 98918</a>
        <a href="https://wa.me/919108598918" class="btn btn-teal btn-sm">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M21 11.5a8.4 8.4 0 0 1-12.3 7.5L3 21l2-5.5A8.5 8.5 0 1 1 21 11.5z"/></svg>
          WhatsApp
        </a>
      </div>
    </div>
  </header>

  <main>
    <section class="page-head">
      <div class="wrap">
        <div>
          <nav class="crumbs" aria-label="Breadcrumb"><a href="index.html">Home</a> <span aria-hidden="true">/</span> Properties</nav>
          <h1 class="h-page" style="margin-top: 10px;">Available properties</h1>
        </div>
        <div class="seg" role="group" aria-label="Search type">
          <button type="button" class="chip-active" data-chip="">All</button>
          <button type="button" data-chip="Rent">Rent</button>
          <button type="button" data-chip="Buy">Buy</button>
        </div>
      </div>
    </section>

    <div class="wrap listing-layout">
      <aside class="filters" aria-label="Filters">
        <form id="filter-form" onsubmit="return false" style="display: contents;">
          <div class="group">
            <label class="label" for="f-q">Requirement</label>
            <input class="field field-sm" type="text" id="f-q" placeholder="e.g. 3 BHK near Sarjapur">
          </div>
          <div class="group">
            <label class="label" for="f-city">City</label>
            <select class="field field-sm" id="f-city"><option value="">All cities</option><option>Bangalore</option><option>Mumbai</option><option>Navi Mumbai</option><option>Thane</option></select>
          </div>
          <div class="group">
            <label class="label" for="f-type">Looking to</label>
            <select class="field field-sm" id="f-type"><option value="">All</option><option>Rent</option><option>Buy</option></select>
          </div>
          <div class="group">
            <label class="label" for="f-cat">Category</label>
            <select class="field field-sm" id="f-cat"><option value="">All categories</option><option>Residential</option><option>Commercial</option></select>
          </div>
          <div class="group">
            <label class="label" for="f-sub">Property type</label>
            <select class="field field-sm" id="f-sub"><option value="">Any type</option></select>
          </div>
          <div class="group">
            <span class="label">Budget (₹)</span>
            <div class="budget-row">
              <input class="field field-sm" type="text" id="f-min" inputmode="numeric" placeholder="Min" aria-label="Minimum budget">
              <input class="field field-sm" type="text" id="f-max" inputmode="numeric" placeholder="Max" aria-label="Maximum budget">
            </div>
            <p class="hint"><span>Monthly rent for Rent, sale price for Buy.</span></p>
          </div>
          <div style="display: flex; gap: 10px;">
            <button type="submit" class="btn btn-ink btn-sm" id="apply-filters" style="flex: 1;">Apply</button>
            <button type="button" class="btn btn-line btn-sm" id="reset-filters">Reset</button>
          </div>
        </form>
      </aside>

      <section class="results" aria-label="Results">
        <div class="results-bar">
          <span class="count"><b id="results-count">0</b> properties</span>
          <label class="muted" style="font-size: 14px; display: flex; align-items: center; gap: 10px;">Sort by
            <select class="field field-sm auto" id="f-sort" style="height: 40px;">
              <option value="newest">Newest</option>
              <option value="price_asc">Price: low to high</option>
              <option value="price_desc">Price: high to low</option>
            </select>
          </label>
        </div>
        <div class="cards cards-2" id="results-grid"></div>
        <nav class="pager" id="pager" aria-label="Pagination"></nav>
      </section>
    </div>
  </main>

  <footer class="site-footer compact">
    <div class="wrap">
      <span class="footer-logo"><img src="assets/logo.png" alt="Vipra Realty" style="height: 26px;"></span>
      <span style="color: #9BA4B2;">+91 91085 98918 · enquiry@viprarealty.com · Sarjapur Road, Bangalore</span>
    </div>
    <div class="footer-bar">
      <div class="wrap">
        <span>© 2026 Vipra Realty. All rights reserved</span>
        <span>www.viprarealty.com</span>
      </div>
    </div>
  </footer>

  <a href="https://wa.me/919108598918" class="wa-float" aria-label="Chat on WhatsApp">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M21 11.5a8.4 8.4 0 0 1-12.3 7.5L3 21l2-5.5A8.5 8.5 0 1 1 21 11.5z"/></svg>
  </a>

</div>
<script src="js/site.js"></script>
</body>
</html>
